{{ define "main" }}<h1>{{ .Title }}</h1><table><thead><tr><th>GitHub handle</th><th>Reputation</th><th>Tier</th><th>Accepted / total submissions</th></tr></thead><tbody>{{ range sort site.Data.contributors.contributors "reputation_score" "desc" }}<tr><td><a href="https://github.com/{{ .github_handle }}">{{ .github_handle }}</a></td><td>{{ .reputation_score }}</td><td>{{ .reputation_tier }}</td><td>{{ .accepted }} / {{ .total_submissions }}</td></tr>{{ end }}</tbody></table>{{ end }}
