# =============================================================================
# mcp-worker CI — typecheck + tests for the read-only MCP Worker (mcp-worker/).
# Runs only on pull requests that touch mcp-worker/**. No deploy step, no
# secrets, no Cloudflare credentials. Deploying is a manual step for the
# operator (see mcp-worker/README.md). Does not affect publish.yml.
# =============================================================================
name: mcp-worker CI

on:
  pull_request:
    paths:
      - 'mcp-worker/**'
      - '.github/workflows/mcp-worker-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
