# =============================================================================
# review.yml — AI Peer Review Pipeline GitHub Action
# =============================================================================
#
# This workflow is the heart of the journal. It triggers when:
# 1. A new Issue is opened (with the submission template)
# 2. Every 6 hours via cron (to process queued submissions by priority)
#
# For direct triggers (issue:opened), it immediately runs the full 6-stage
# review pipeline on the new submission. For cron triggers, it checks the
# issue queue for unprocessed submissions and processes them in priority order.
#
# The workflow uses these secrets:
#   OPENROUTER_API_KEY — For the LLM review + web search grounding via OpenRouter
#   GITHUB_TOKEN — Auto-provided by Actions for API access (no setup needed)
#
# Optional secrets:
#   S2_API_KEY — Semantic Scholar API key for higher novelty check rate limits
#   PUBROOT_MODEL — Model to use via OpenRouter (default: google/gemini-3.8-flash)
#
# COST: $0 on GitHub's free tier (2,000 Action minutes/month for public repos).
# Each review takes ~2-3 minutes of compute time, so the free tier handles
# ~700-1000 reviews/month. LLM costs via OpenRouter vary by model choice.
# =============================================================================

name: AI Peer Review Pipeline

on:
  # ----- TRIGGER 1: New submission (Issue opened) -----
  # Runs immediately when someone opens an Issue using our template.
  # This means the submitter gets a review comment within ~3-5 minutes.
  issues:
    types: [opened]

  # ----- TRIGGER 2: Queue processor (every 6 hours) -----
  # Picks up any submissions that were queued (e.g., if the direct trigger
  # failed, or for batching during high-volume periods). Processes by priority
  # label: critical > high > normal > low.
  #
  # HISTORY: Originally set to every 15 minutes, but that burned ~960 Actions
  # minutes/month (nearly half the 2,000 free tier) even when there were zero
  # submissions. Changed to every 6 hours on Feb 17, 2026 to conserve minutes.
  # The primary trigger for reviews is still the issue:opened event, which fires
  # immediately when someone submits. The cron is just a safety net for missed
  # triggers. When submission volume grows, we can increase frequency.
  schedule:
    - cron: '0 */6 * * *'

  # ----- TRIGGER 3: Manual dispatch (for debugging/re-running) -----
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true
        type: number

# Concurrency: only one review pipeline instance runs at a time.
# If a new trigger fires while one is running, it queues (not cancels).
# This prevents race conditions on contributors.json and agent-index.json.
concurrency:
  group: review-pipeline
  cancel-in-progress: false

# SECURITY ARCHITECTURE (B1 second pass, 2026-10-24):
# The workflow is split into two jobs to enforce secret isolation:
#   1. analyze-submission: Handles untrusted content (parsing, novelty check,
#      cloning submitter repos) with NO sensitive secrets and read-only permissions.
#   2. review-and-publish: Calls the LLM, posts results, commits files. This job
#      has OPENROUTER_API_KEY and write permissions, but never touches submitter content.
# Data flows from job 1 → job 2 via artifacts (JSON files). This architecture ensures
# that even if a malicious submitter exploits a bug in stages 1-3, they cannot access
# OPENROUTER_API_KEY or gain write access to the repository.
permissions: {}  # Permissions set per-job below

jobs:
  # =============================================================================
  # JOB 1: ANALYZE SUBMISSION (Stages 1-3)
  # =============================================================================
  # This job handles all untrusted content: parsing the issue body, searching
  # external APIs, and cloning the submitter's repository. It runs with:
  #   - READ-ONLY permissions (contents: read, issues: read)
  #   - NO OPENROUTER_API_KEY (no LLM secrets in scope)
  #   - NO write-capable GITHUB_TOKEN (cannot modify repo or post comments)
  # Even if a malicious submitter exploits a vulnerability (e.g., the symlink
  # attack that B1 fixed), they cannot exfiltrate write tokens or API keys
  # because those secrets are not present in this job's environment.
  # =============================================================================
  analyze-submission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read    # Read-only access to journals.json, agent-index.json
      issues: read      # Read issue body and metadata
    outputs:
      issue_number: ${{ steps.get-issue.outputs.issue_number }}
      has_issue: ${{ steps.get-issue.outputs.issue_number != '' }}
      approved: ${{ steps.check-approval.outputs.approved }}
      gate_kind: ${{ steps.check-approval.outputs.gate_kind }}
      gate_reason: ${{ steps.check-approval.outputs.gate_reason }}

    steps:
      # ---------------------------------------------------------------
      # Step 1: Checkout the repo
      # ---------------------------------------------------------------
      # We need the full repo for reading config files (journals.json,
      # contributors.json, agent-index.json, calibration examples) and
      # for the Python review agent code.
      # SECURITY FIX B1: Set persist-credentials to false so the GITHUB_TOKEN
      # is NOT written to .git/config. This prevents a malicious submitter repo
      # from exfiltrating the token via a symlink to .git/config during stage 3.
      # ---------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # ---------------------------------------------------------------
      # Step 2: Set up Python
      # ---------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # ---------------------------------------------------------------
      # Step 3: Install Python dependencies
      # ---------------------------------------------------------------
      - name: Install dependencies
        run: |
          pip install -r _review_agent/requirements.txt

      # ---------------------------------------------------------------
      # Step 3b: Determine which issue to process (with gating)
      # ---------------------------------------------------------------
      # For issue:opened triggers, use the event payload issue number.
      # For cron triggers, find the highest-priority unprocessed issue.
      # For manual dispatch, use the provided issue number.
      # 
      # GATING: All candidates pass author_gating.py check before selection.
      # The gate approves:
      # 1. OWNER, MEMBER, or COLLABORATOR (via author_association), OR
      # 2. Authors on .github/REVIEW_ALLOWLIST.txt, OR
      # 3. Issues with `approved-for-review` label (under daily rate limit)
      # Issues with `editorial-hold` label are always skipped.
      #
      # THREE-TIER PICKER (B4 fix):
      # 1. publish-failed (review passed, publish failed, should retry)
      # 2. priority-labelled (critical > high > normal > low)
      # 3. unreviewed submission (no bot review comment, newest first)
      # 4. fallback: 0-label submissions
      #
      # FIX: gh issue list defaults to --limit 30. We have 119 open submissions,
      # so #121 (54th newest), #60 (88th), and #25 (108th) were unreachable.
      # Now every query uses --limit 500.
      # ---------------------------------------------------------------
      - name: Determine issue number
        id: get-issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          DISPATCH_ISSUE: ${{ github.event.inputs.issue_number }}
        run: |
          if [ "$EVENT_NAME" = "issues" ]; then
            echo "issue_number=$EVENT_ISSUE" >> $GITHUB_OUTPUT
            echo "Processing issue #$EVENT_ISSUE (direct trigger)"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "issue_number=$DISPATCH_ISSUE" >> $GITHUB_OUTPUT
            echo "Processing issue #$DISPATCH_ISSUE (manual dispatch)"
          else
            # Cron: three-tier picker with gating loop
            ISSUE=""
            
            # TIER 1: publish-failed (highest priority)
            # Review already passed, only publication failed. Retry these first.
            # Exclude editorial-hold, apply gating.
            echo "Tier 1: Checking publish-failed issues..."
            CANDIDATES=$(gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --label "publish-failed" \
              --limit 500 \
              --json number,labels \
              --jq 'map(select((.labels|map(.name)) as $l | ($l|all(. != "editorial-hold")))) | .[].number' \
              2>/dev/null || true)
            
            for C in $CANDIDATES; do
              python _review_agent/author_gating.py check "$C" >/dev/null 2>&1 && { ISSUE="$C"; echo "  Selected publish-failed #$C"; break; }
              echo "  #$C skipped (gated or on hold)"
            done

            # TIER 2: priority-labelled issues
            # FIX: gh --label "a,b,c" is an AND (all labels required). No issue has all four.
            # Fetch all open issues with JSON, filter in jq for ANY priority: label,
            # exclude terminal/hold labels, sort by priority (critical > high > normal > low).
            if [ -z "$ISSUE" ]; then
              echo "Tier 2: Checking priority-labelled issues..."
              CANDIDATES=$(gh issue list \
                --repo "$GITHUB_REPOSITORY" \
                --state open \
                --limit 500 \
                --json number,labels \
                --jq 'map(select((.labels|map(.name)) as $l | (($l|any(startswith("priority:"))) and ($l|all(. != "accepted" and . != "rejected" and . != "validation-failed" and . != "publish-failed" and . != "editorial-hold"))))) | sort_by(((.labels|map(.name)|map(select(startswith("priority:")))|.[0]) as $p | {"priority:critical":0,"priority:high":1,"priority:normal":2,"priority:low":3}[$p] // 9), .number) | .[].number' \
                2>/dev/null || true)
              
              for C in $CANDIDATES; do
                python _review_agent/author_gating.py check "$C" >/dev/null 2>&1 && { ISSUE="$C"; echo "  Selected priority issue #$C"; break; }
                echo "  #$C skipped (gated or on hold)"
              done
            fi

            # TIER 3: unreviewed submissions (no bot review comment)
            # These are issues with the submission label but no bot review comment.
            # Exclude terminal labels, editorial-hold, apply gating.
            if [ -z "$ISSUE" ]; then
              echo "Tier 3: Checking unreviewed submissions..."
              CANDIDATES=$(gh issue list \
                --repo "$GITHUB_REPOSITORY" \
                --state open \
                --label "submission" \
                --limit 500 \
                --json number,labels \
                --jq 'map(select(.labels | map(.name) | (contains(["accepted"]) or contains(["rejected"]) or contains(["validation-failed"]) or contains(["publish-failed"]) or contains(["review-error"]) or contains(["editorial-hold"])) | not)) | .[].number' \
                2>/dev/null || true)
              
              for C in $CANDIDATES; do
                python _review_agent/author_gating.py check "$C" >/dev/null 2>&1 || { echo "  #$C skipped (gated)"; continue; }
                
                # Check if this issue has a bot review comment
                HAS_REVIEW=$(gh api repos/"$GITHUB_REPOSITORY"/issues/"$C"/comments \
                  --jq 'map(select(.user.login == "github-actions[bot]" and (.body | contains("# AI Peer Review") or contains("Submission Validation Failed")))) | length' \
                  2>/dev/null || echo "0")
                
                if [ "$HAS_REVIEW" = "0" ]; then
                  ISSUE="$C"
                  echo "  Found approved unreviewed issue: #$C"
                  break
                fi
              done
            fi

            # TIER 4: 0-label fallback (rare: submissions with no labels at all)
            # Apply gating loop.
            if [ -z "$ISSUE" ]; then
              echo "Tier 4: Checking 0-label issues..."
              CANDIDATES=$(gh issue list \
                --repo "$GITHUB_REPOSITORY" \
                --state open \
                --limit 500 \
                --json number,labels \
                --jq 'map(select(.labels | length == 0)) | .[].number' \
                2>/dev/null || true)
              
              for C in $CANDIDATES; do
                python _review_agent/author_gating.py check "$C" >/dev/null 2>&1 && { ISSUE="$C"; echo "  Selected 0-label issue #$C"; break; }
                echo "  #$C skipped (gated)"
              done
            fi

            if [ -z "$ISSUE" ]; then
              echo "No unprocessed submissions found. Exiting."
              echo "issue_number=" >> $GITHUB_OUTPUT
            else
              echo "issue_number=$ISSUE" >> $GITHUB_OUTPUT
              echo "Processing issue #$ISSUE (cron trigger)"
            fi
          fi

      # ---------------------------------------------------------------
      # Step 4: Check author approval gate
      # ---------------------------------------------------------------
      # Verifies the issue author is approved before running stages 1-3.
      # This prevents untrusted submissions from burning resources.
      # This step runs WITHOUT GEMINI_API_KEY (security isolation).
      #
      # Outputs gate_kind and gate_reason for the notify-gated job (B4 fix).
      # ---------------------------------------------------------------
      - name: Check author approval
        if: steps.get-issue.outputs.issue_number != ''
        id: check-approval
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          ISSUE_NUM="${{ steps.get-issue.outputs.issue_number }}"
          echo "Checking approval for issue #$ISSUE_NUM..."
          
          python _review_agent/author_gating.py check "$ISSUE_NUM" > /tmp/approval.txt 2>&1
          EXIT_CODE=$?
          
          cat /tmp/approval.txt
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "approved=true" >> $GITHUB_OUTPUT
          else
            echo "approved=false" >> $GITHUB_OUTPUT
            
            # Parse gate_kind and gate_reason for the notify-gated job
            KIND=$(grep "Kind:" /tmp/approval.txt | cut -d: -f2- | xargs)
            REASON=$(grep "Reason:" /tmp/approval.txt | cut -d: -f2- | xargs)
            AUTHOR=$(grep "Author:" /tmp/approval.txt | cut -d: -f2- | xargs)
            
            echo "gate_kind=${KIND}" >> $GITHUB_OUTPUT
            echo "gate_reason=${REASON}" >> $GITHUB_OUTPUT
            
            echo "Issue #$ISSUE_NUM gated: @$AUTHOR - $REASON (kind: $KIND)"
          fi

      # ---------------------------------------------------------------
      # Step 6: Run stages 1-3 (parse, novelty, repo reading)
      # ---------------------------------------------------------------
      # SECURITY: This step has NO OPENROUTER_API_KEY. It only has a read-only
      # GITHUB_TOKEN and the optional S2_API_KEY (low-risk, public data).
      # The output is written to stages_1_to_3_output.json and uploaded
      # as an artifact for the second job to consume.
      # Only runs if the issue passed the approval gate.
      # ---------------------------------------------------------------
      - name: Analyze submission (stages 1-3)
        if: steps.get-issue.outputs.issue_number != '' && steps.check-approval.outputs.approved == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: _review_agent
        run: |
          python stages_1_to_3_analyzer.py ${{ steps.get-issue.outputs.issue_number }} stages_1_to_3_output.json
      
      # ---------------------------------------------------------------
      # Step 7: Upload analysis results as artifact
      # ---------------------------------------------------------------
      # The artifact contains parsed submission data, novelty results, and
      # repo context. The review-and-publish job downloads this artifact
      # and runs stages 4-6 without ever touching the submitter's repo.
      # Only uploads if the issue passed approval gate.
      # ---------------------------------------------------------------
      - name: Upload analysis artifact
        if: steps.get-issue.outputs.issue_number != '' && steps.check-approval.outputs.approved == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: submission-analysis-${{ steps.get-issue.outputs.issue_number }}
          path: _review_agent/stages_1_to_3_output.json
          retention-days: 1
  
  # =============================================================================
  # JOB 2: NOTIFY GATED SUBMISSIONS
  # =============================================================================
  # This job posts a "Review Pending Approval" comment on gated submissions.
  # It runs only when analyze-submission found an issue but the author gate
  # returned approved=false with kind=needs-approval.
  #
  # SECURITY: This job has NO secrets (no GEMINI_API_KEY, no submitter content).
  # It only has issues: write to post the idempotent comment and add labels.
  # Label creation is moved here from analyze-submission (which had issues: read only).
  # =============================================================================
  notify-gated:
    needs: analyze-submission
    if: needs.analyze-submission.outputs.has_issue == 'true' && needs.analyze-submission.outputs.approved == 'false' && needs.analyze-submission.outputs.gate_kind == 'needs-approval'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
    
    steps:
      # No checkout, no Python setup, no secrets - only comment posting
      
      # ---------------------------------------------------------------
      # Step 1: Ensure pipeline labels exist
      # ---------------------------------------------------------------
      # GitHub rejects add_labels if the label was never created. Creating
      # idempotently avoids manual setup when onboarding a new fork.
      # Moved here from analyze-submission (which had issues: read only).
      # ---------------------------------------------------------------
      - name: Ensure pipeline labels exist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "publish-failed" --color "d73a4a" --description "Review passed; git publish step failed — safe to retry" 2>/dev/null || true
          gh label create "approved-for-review" --color "0e8a16" --description "Maintainer-approved submission ready for AI review" 2>/dev/null || true
          gh label create "editorial-hold" --color "b60205" --description "Submission on hold pending editorial decision" 2>/dev/null || true
          gh label create "awaiting-approval" --color "fbca04" --description "Submission awaiting maintainer approval" 2>/dev/null || true
      
      # ---------------------------------------------------------------
      # Step 2: Post gating comment (idempotent)
      # ---------------------------------------------------------------
      # Only post if:
      # - No github-actions[bot] comment contains "pubroot:pending-approval"
      #   or the legacy text "Review Pending Approval"
      # - Issue does not already have awaiting-approval or approved-for-review label
      # ---------------------------------------------------------------
      - name: Post gating comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ needs.analyze-submission.outputs.issue_number }}
          GATE_REASON: ${{ needs.analyze-submission.outputs.gate_reason }}
        run: |
          # Check for existing bot comments
          EXISTING_COUNT=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" \
            --paginate \
            --jq '[.[]|select(.user.login=="github-actions[bot]" and ((.body|contains("pubroot:pending-approval")) or (.body|contains("Review Pending Approval"))))]|length' \
            | awk '{s+=$1} END {print s}')
          
          if [ "$EXISTING_COUNT" -gt 0 ]; then
            echo "Gating comment already exists, skipping"
            exit 0
          fi
          
          # Check for existing labels
          LABELS=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" --jq '.labels[].name')
          if echo "$LABELS" | grep -q "awaiting-approval\|approved-for-review"; then
            echo "Issue already has approval-related label, skipping"
            exit 0
          fi
          
          # Post comment
          BODY="$RUNNER_TEMP/pending.md"
          printf '%s\n' \
            '<!-- pubroot:pending-approval -->' \
            '## ⏸️ Review Pending Approval' \
            '' \
            'This submission is queued until a maintainer adds the `approved-for-review` label.' \
            "Reason: ${GATE_REASON}" \
            '' \
            'No action is needed from you. The 6-hour queue picks it up once approved.' > "$BODY"
          
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$BODY"
          gh issue edit "$ISSUE" --add-label awaiting-approval
          
          echo "Posted gating comment and added awaiting-approval label"
  
  # =============================================================================
  # JOB 3: REVIEW AND PUBLISH (Stages 4-6)
  # =============================================================================
  # This job runs the LLM review, posts the comment, and publishes accepted papers.
  # It has full secrets (OPENROUTER_API_KEY, write-capable GITHUB_TOKEN) but NEVER
  # checks out or executes any code from the submitter's repository. It only reads
  # the JSON artifact produced by job 1, which contains sanitized, structured data.
  # 
  # SECURITY: Even if a malicious submitter exploited a vulnerability in stages 1-3,
  # the worst they could do is corrupt the JSON artifact. They cannot directly
  # access OPENROUTER_API_KEY because it's not in scope during stages 1-3. The JSON
  # is further scrubbed by secret_scrubber before any output is posted.
  # =============================================================================
  review-and-publish:
    needs: analyze-submission
    if: needs.analyze-submission.outputs.has_issue == 'true' && needs.analyze-submission.outputs.approved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # Write to main branch (publication)
      issues: write         # Post review comments
      pull-requests: write  # Create PRs for publication
    
    steps:
      # ---------------------------------------------------------------
      # Step 1: Checkout the repo (for stage 6 file operations)
      # ---------------------------------------------------------------
      # We need the repo to update agent-index.json, contributors.json,
      # and to publish papers. We do NOT need the submitter's repo.
      # persist-credentials: false is not needed here because this job
      # never clones untrusted repos.
      # ---------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      # ---------------------------------------------------------------
      # Step 2: Set up Python
      # ---------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      # ---------------------------------------------------------------
      # Step 3: Install Python dependencies
      # ---------------------------------------------------------------
      - name: Install dependencies
        run: |
          pip install -r _review_agent/requirements.txt
      
      # ---------------------------------------------------------------
      # Step 4: Download analysis artifact from job 1
      # ---------------------------------------------------------------
      # This artifact contains the parsed submission, novelty results,
      # and repo context from stages 1-3. We do NOT re-run stages 1-3.
      # ---------------------------------------------------------------
      - name: Download analysis artifact
        uses: actions/download-artifact@v4
        with:
          name: submission-analysis-${{ needs.analyze-submission.outputs.issue_number }}
          path: _review_agent/
      
      # ---------------------------------------------------------------
      # Step 5: Run stages 4-6 (prompt building, LLM review, publication)
      # ---------------------------------------------------------------
      # SECURITY: This step has OPENROUTER_API_KEY and write permissions,
      # but it NEVER touches the submitter's repo. It only reads the
      # JSON artifact from job 1.
      # ---------------------------------------------------------------
      - name: Review and publish (stages 4-6)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PUBROOT_MODEL: ${{ secrets.PUBROOT_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        working-directory: _review_agent
        run: |
          python stages_4_to_6_reviewer.py stages_1_to_3_output.json
